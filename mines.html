<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KIANI MINES</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --panel: #111; --line: #332b00; --gold: #ffcc00; --red: #ff3355; --green: #00ff88; --font-en: 'Orbitron'; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body { margin:0; background: radial-gradient(circle at 50% 0%, #1a1500 0%, #000 100%); color: #fff; font-family: 'Vazirmatn', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; user-select: none; }
.top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--line); border-radius: 0 0 16px 16px; }
.back-btn { color: var(--gold); text-decoration: none; font-weight: 700; font-size: 14px; }
.balance-box { background: #000; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--gold); font-family: var(--font-en); font-weight: 900; color: var(--gold); font-size: 16px; }
.container { width: 100%; max-width: 500px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

.notif-bar { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; font-weight: 700; font-size: 16px; min-height: 50px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
.notif-bar.gem { border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(0,255,136,0.2); }
.notif-bar.bomb { border-color: var(--red); color: var(--red); box-shadow: 0 0 15px rgba(255,51,85,0.2); }
.notif-bar.neutral { color: #888; }

.stats { display: flex; justify-content: space-between; background: var(--panel); padding: 15px; border-radius: 16px; border: 1px solid var(--line); }
.stat-item { text-align: center; flex: 1; }
.stat-label { font-size: 12px; color: #888; margin-bottom: 5px; }
.stat-value { font-family: var(--font-en); font-size: 18px; font-weight: 900; color: var(--gold); }

.grid-container { width: 100%; aspect-ratio: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px; background: var(--panel); padding: 12px; border-radius: 20px; border: 1px solid var(--line); }
.tile { background: linear-gradient(135deg, #1c1c1c 0%, #0a0a0a 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; position: relative; transition: 0.2s, transform 0.1s; box-shadow: inset 0 -4px 0 #000, inset 0 2px 0 rgba(255,255,255,0.1); user-select: none; }
.tile:active:not(.revealed) { transform: scale(0.92); }
.tile.revealed { background: #000; box-shadow: inset 0 0 15px rgba(0,0,0,1); cursor: default; }
.tile.gem { animation: pop 0.3s; color: var(--green); text-shadow: 0 0 15px var(--green); font-size: 24px; }
.tile.bomb { background: linear-gradient(135deg, var(--red) 0%, #660015 100%); animation: shake 0.4s; color: #fff; font-size: 24px; }
@keyframes pop { 0%{transform:scale(0.3); opacity:0} 100%{transform:scale(1); opacity:1} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.controls { display: flex; flex-direction: column; gap: 10px; }
.input-row { display: flex; gap: 10px; }
.bet-input { flex: 1; background: #000; border: 1px solid var(--line); border-radius: 12px; color: var(--gold); padding: 12px; font-family: var(--font-en); font-size: 18px; font-weight: 700; text-align: center; outline: none; }
.action-btn { background: linear-gradient(180deg, var(--red), #990022); color: #fff; border: 2px solid #ff667f; border-radius: 12px; padding: 12px 20px; font-weight: 900; font-size: 16px; cursor: pointer; flex: 1; }
.action-btn.cashout { background: linear-gradient(180deg, var(--green), #009955); color: #000; border-color: #66ffb3; }
.action-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="buysell.html" class="back-btn">🔙 منو</a>
  <div class="balance-box"><span id="balanceDisplay">0</span> <span style="font-size:10px;">T</span></div>
</div>

<div class="container">
  <div class="notif-bar neutral" id="notificationBar">برای شروع بازی، مبلغ را وارد کرده و شروع را بزنید.</div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-label">ضریب فعلی</div>
      <div class="stat-value" id="currentMult">1.00x</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">سود ممکن</div>
      <div class="stat-value" id="potentialWin" style="color: var(--green);">0</div>
    </div>
  </div>

  <div class="grid-container" id="minesGrid"></div>

  <div class="controls">
    <div class="input-row">
      <input type="number" id="betAmount" class="bet-input" value="10" min="1">
      <button class="action-btn" id="startBtn" onclick="startGame()">شروع بازی</button>
      <button class="action-btn cashout" id="cashoutBtn" onclick="cashOut()" style="display:none;">برداشت</button>
    </div>
  </div>
</div>

<script>
"use strict";

var STORAGE_KEY = "kiani_exchange_v5";
var SESSION_KEY = "kiani_exchange_session";
var TOKEN_PRICE = 1000;
var currentUser = null;
var userData = null;

function loadDB() {
  var s = localStorage.getItem(STORAGE_KEY);
  if (s) { var db = JSON.parse(s); currentUser = localStorage.getItem(SESSION_KEY); if (currentUser && db.users[currentUser]) userData = db.users[currentUser]; }
}
function saveDB() {
  if (currentUser && userData) {
    var db = JSON.parse(localStorage.getItem(STORAGE_KEY));
    db.users[currentUser] = userData;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }
}
function updateUI() { if (userData) document.getElementById("balanceDisplay").textContent = userData.tokens.toLocaleString("en-US"); }

// تنظیمات بازی
var gridSize = 25; 
var minesCount = 19; // ۱۹ بمب و ۶ الماس (نسبت ۱ به ۳)
var currentBet = 10;
var isPlaying = false;
var revealedCount = 0;
var currentMult = 1.0;
var minesPositions = [];

// محاسبه ضریب
function calculateMultiplier(revealed, totalMines) {
  if (revealed === 0) return 1.0;
  var mult = 1.0;
  for (var i = 0; i < revealed; i++) {
    mult *= (gridSize - i) / (gridSize - totalMines - i);
  }
  return mult * 0.95; // کارمزد
}

function updateStats() {
  currentMult = calculateMultiplier(revealedCount, minesCount);
  document.getElementById("currentMult").textContent = currentMult.toFixed(2) + "x";
  var potential = Math.floor(currentBet * currentMult);
  document.getElementById("potentialWin").textContent = potential.toLocaleString("en-US");
}

function updateNotification(text, type) {
  var bar = document.getElementById("notificationBar");
  bar.textContent = text;
  bar.className = "notification-bar " + type;
}

function initGrid() {
  var grid = document.getElementById("minesGrid");
  grid.innerHTML = "";
  for (var i = 0; i < gridSize; i++) {
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.index = i;
    tile.onclick = function() { revealTile(this); };
    grid.appendChild(tile);
  }
}

function startGame() {
  if (!userData) { alert("ابتدا در منو ثبت‌نام کنید."); return; }
  if (isPlaying) return;
  
  currentBet = parseInt(document.getElementById("betAmount").value);
  if (!currentBet || currentBet < 1) { alert("مبلغ نامعتبر است."); return; }
  if (userData.tokens < currentBet) { alert("موجودی کافی نیست!"); return; }
  
  userData.tokens -= currentBet;
  saveDB();
  updateUI();
  
  isPlaying = true;
  revealedCount = 0;
  currentMult = 1.0;
  updateStats();
  updateNotification("منتظر انتخاب شما...", "neutral");
  
  minesPositions = [];
  while (minesPositions.length < minesCount) {
    var r = Math.floor(Math.random() * gridSize);
    if (minesPositions.indexOf(r) === -1) minesPositions.push(r);
  }
  
  var tiles = document.querySelectorAll(".tile");
  for (var i = 0; i < tiles.length; i++) {
    tiles[i].className = "tile";
    tiles[i].textContent = "";
  }
  
  document.getElementById("startBtn").style.display = "none";
  document.getElementById("cashoutBtn").style.display = "block";
  document.getElementById("cashoutBtn").disabled = true;
  document.getElementById("betAmount").disabled = true;
}

function revealTile(tile) {
  if (!isPlaying || tile.classList.contains("revealed")) return;
  
  var index = parseInt(tile.dataset.index);
  tile.classList.add("revealed");
  
  if (minesPositions.indexOf(index) !== -1) {
    // بمب!
    tile.classList.add("bomb");
    tile.textContent = "💥";
    updateNotification("❌ به بمب برخورد کردید! باختید.", "bomb");
    gameOver();
  } else {
    // الماس!
    tile.classList.add("gem");
    tile.textContent = "💎";
    revealedCount++;
    updateStats();
    
    updateNotification("✅ الماس پیدا کردید! + سود", "gem");
    
    document.getElementById("cashoutBtn").disabled = false;
    
    if (revealedCount === (gridSize - minesCount)) {
      cashOut();
    }
  }
}

function gameOver() {
  isPlaying = false;
  document.getElementById("cashoutBtn").style.display = "none";
  document.getElementById("startBtn").style.display = "block";
  document.getElementById("startBtn").disabled = true;
  document.getElementById("betAmount").disabled = false;
  
  var tiles = document.querySelectorAll(".tile");
  minesPositions.forEach(function(pos) {
    var t = tiles[pos];
    if (!t.classList.contains("bomb")) {
      t.classList.add("revealed");
      t.textContent = "💣";
      t.style.opacity = "0.5";
    }
  });
  
  // ثبت در تاریخچه (اختیاری، چون دیتابیس مشترک است)
  if(userData.history) {
      userData.history.push({ type: "game", game: "mines", amount: -currentBet, status: "done", ts: Date.now() });
  }
  saveDB();
  
  setTimeout(function() {
    document.getElementById("startBtn").disabled = false;
  }, 2000);
}

function cashOut() {
  if (!isPlaying) return;
  isPlaying = false;
  
  var winAmount = Math.floor(currentBet * currentMult);
  userData.tokens += winAmount;
  saveDB();
  updateUI();
  
  var profit = winAmount - currentBet;
  if(userData.history) {
      userData.history.push({ type: "game", game: "mines", amount: profit, status: "done", ts: Date.now() });
  }
  saveDB();
  
  document.getElementById("cashoutBtn").style.display = "none";
  document.getElementById("startBtn").style.display = "block";
  document.getElementById("betAmount").disabled = false;
  
  var tiles = document.querySelectorAll(".tile");
  minesPositions.forEach(function(pos) {
    var t = tiles[pos];
    if (!t.classList.contains("revealed")) {
      t.classList.add("revealed");
      t.textContent = "💣";
      t.style.opacity = "0.5";
    }
  });
  
  updateNotification("💰 شما با موفقیت " + winAmount + " توکن برداشت کردید!", "gem");
}

loadDB(); 
if(userData) { updateUI(); initGrid(); updateStats(); } 
else { document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:50px;'>ابتدا در منو ثبت‌نام کنید.</h2>"; }

</script>
</body>
</html>
