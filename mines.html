<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KIANI MINES</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505; --panel: #111111; --line: #332b00;
  --text: #ffffff; --muted: #888888;
  --gold: #ffcc00; --red: #ff3355; --green: #00ff88; --cyan: #00e5ff;
  --font-fa: 'Vazirmatn', Tahoma, sans-serif;
  --font-en: 'Orbitron', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body {
  margin:0; padding:0; 
  background: radial-gradient(circle at 50% 0%, #1a1500 0%, #000000 100%);
  color: var(--text); font-family: var(--font-fa);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden; user-select: none;
}

/* Header */
.top-bar {
  width: 100%; max-width: 600px; display: flex; justify-content: space-between;
  align-items: center; padding: 15px 20px; background: rgba(0,0,0,0.8);
  border-bottom: 1px solid var(--line); border-radius: 0 0 20px 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.8), 0 0 15px rgba(255,204,0,0.1); backdrop-filter: blur(10px);
  position: relative; z-index: 10;
}
.back-btn { color: var(--gold); text-decoration: none; font-weight: 700; }
.balance-box {
  background: #000; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--gold);
  font-family: var(--font-en); font-weight: 900; color: var(--gold); font-size: 18px;
  box-shadow: inset 0 0 10px rgba(255,204,0,0.3), 0 0 10px rgba(255,204,0,0.2);
}

/* Game Container */
.game-container {
  width: 100%; max-width: 500px; padding: 15px; display: flex; flex-direction: column; gap: 15px;
}

/* Notification Bar */
.notification-bar {
  width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; text-align: center; font-weight: 700;
  font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  transition: all 0.3s;
  min-height: 50px;
}
.notification-bar.gem { border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(0,255,136,0.2); }
.notification-bar.bomb { border-color: var(--red); color: var(--red); box-shadow: 0 0 15px rgba(255,51,85,0.2); }
.notification-bar.neutral { color: var(--muted); }

/* Stats */
.stats {
  display: flex; justify-content: space-between; background: var(--panel);
  padding: 15px; border-radius: 16px; border: 1px solid var(--line);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}
.stat-item { text-align: center; flex: 1; }
.stat-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.stat-value { font-family: var(--font-en); font-size: 18px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255,204,0,0.3); }

/* Mines Grid */
.grid-container {
  width: 100%; aspect-ratio: 1; display: grid;
  grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
  gap: 8px; background: var(--panel); padding: 12px; border-radius: 20px;
  border: 1px solid var(--line); box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.8);
}
.tile {
  background: linear-gradient(135deg, #1c1c1c 0%, #0a0a0a 100%);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 32px; cursor: pointer; position: relative; transition: 0.2s, transform 0.1s;
  box-shadow: inset 0 -4px 0 #000, inset 0 2px 0 rgba(255,255,255,0.1), 0 2px 5px rgba(0,0,0,0.5);
  user-select: none;
}
.tile:active:not(.revealed) { transform: scale(0.92); }
.tile:hover:not(.revealed) { background: linear-gradient(135deg, #2a2a2a 0%, #111 100%); }
.tile.revealed { background: #000; box-shadow: inset 0 0 15px rgba(0,0,0,1); cursor: default; }
.tile.revealed::after { content: ''; position: absolute; inset: 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }

.tile.gem { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: var(--green); text-shadow: 0 0 15px var(--green); font-size: 24px; }
.tile.bomb { background: linear-gradient(135deg, var(--red) 0%, #660015 100%); animation: shake 0.4s; color: #fff; font-size: 24px; text-shadow: 0 0 10px #fff; }
.tile.dimmed { opacity: 0.3; filter: grayscale(1); }

@keyframes pop { 0%{transform:scale(0.3); opacity:0} 100%{transform:scale(1); opacity:1} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

/* Controls */
.controls {
  display: flex; flex-direction: column; gap: 10px;
}
.input-row { display: flex; gap: 10px; }
.bet-input {
  flex: 1; background: #000; border: 1px solid var(--line); border-radius: 12px;
  color: var(--gold); padding: 12px; font-family: var(--font-en); font-size: 18px;
  font-weight: 700; text-align: center; outline: none;
}
.action-btn {
  background: linear-gradient(180deg, var(--red), #990022); color: #fff;
  border: 2px solid #ff667f; border-radius: 12px; padding: 12px 20px; font-weight: 900;
  font-size: 16px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,51,85,0.3);
  transition: 0.2s; flex: 1;
}
.action-btn:active { transform: translateY(2px); }
.action-btn.cashout {
  background: linear-gradient(180deg, var(--green), #009955); color: #000;
  border-color: #66ffb3; box-shadow: 0 5px 15px rgba(0,255,136,0.3);
}
.action-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #111; border: 1px solid var(--gold); color: var(--gold); padding: 12px 25px;
  border-radius: 30px; font-weight: 700; opacity: 0; transition: 0.3s; pointer-events: none;
  z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255,204,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { border-color: var(--red); color: var(--red); box-shadow: 0 0 15px rgba(255,51,85,0.3); }
</style>
</head>
<body>

<div class="top-bar">
  <a href="#" class="back-btn" onclick="window.history.back(); return false;">🔙 بازگشت</a>
  <div class="balance-box">
    <span id="balanceDisplay">0</span> <span style="font-size:12px; color:var(--muted)">T</span>
  </div>
</div>

<div class="game-container">
  <!-- نوار وضعیت بالای صفحه -->
  <div class="notification-bar neutral" id="notificationBar">
    برای شروع بازی، مبلغ را وارد کرده و دکمه شروع را بزنید.
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-label">ضریب فعلی</div>
      <div class="stat-value" id="currentMult">1.00x</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">سود ممکن</div>
      <div class="stat-value" id="potentialWin" style="color: var(--green);">0</div>
    </div>
  </div>

  <div class="grid-container" id="minesGrid"></div>

  <div class="controls">
    <div class="input-row">
      <input type="number" id="betAmount" class="bet-input" value="10" min="1">
      <button class="action-btn" id="startBtn" onclick="startGame()">شروع بازی</button>
      <button class="action-btn cashout" id="cashoutBtn" onclick="cashOut()" style="display:none;">برداشت</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

// ==========================================
// ۱. دیتابیس
// ==========================================
var STORAGE_KEY = "kiani_spin_v4_db";
var db = { users: {}, currentUser: null };
var state = null;

function initDB() {
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) db.users = JSON.parse(saved);
    for (var u in db.users) { db.currentUser = u; state = db.users[u].data; break; }
  } catch(e) {}
}
function saveState() {
  if (db.currentUser && db.users[db.currentUser]) {
    db.users[db.currentUser].data = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db.users));
  }
}
function updateBalanceUI() {
  if (state) document.getElementById("balanceDisplay").textContent = state.tokens.toLocaleString("en-US");
  else document.getElementById("balanceDisplay").textContent = "0";
}
function toast(msg, isErr) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show " + (isErr ? "err" : "");
  setTimeout(function(){ t.className = "toast"; }, 3000);
}

function updateNotification(text, type) {
  var bar = document.getElementById("notificationBar");
  bar.textContent = text;
  bar.className = "notification-bar " + type;
}

// ==========================================
// ۲. تنظیمات بازی
// ==========================================
var gridSize = 25; // 5x5
var minesCount = 5; // تعداد بمب‌ها بیشتر شد
var currentBet = 10;
var isPlaying = false;
var revealedCount = 0;
var currentMult = 1.0;
var minesPositions = [];

// محاسبه ضریب
function calculateMultiplier(revealed, totalMines) {
  if (revealed === 0) return 1.0;
  var mult = 1.0;
  for (var i = 0; i < revealed; i++) {
    mult *= (gridSize - i) / (gridSize - totalMines - i);
  }
  return mult * 0.95; // کارمزد
}

function updateStats() {
  currentMult = calculateMultiplier(revealedCount, minesCount);
  document.getElementById("currentMult").textContent = currentMult.toFixed(2) + "x";
  var potential = Math.floor(currentBet * currentMult);
  document.getElementById("potentialWin").textContent = potential.toLocaleString("en-US");
}

// ==========================================
// ۳. راه‌اندازی بازی
// ==========================================
function initGrid() {
  var grid = document.getElementById("minesGrid");
  grid.innerHTML = "";
  for (var i = 0; i < gridSize; i++) {
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.index = i;
    tile.onclick = function() { revealTile(this); };
    grid.appendChild(tile);
  }
}

function startGame() {
  if (!state) { toast("ابتدا در ربات اصلی لاگین کنید.", true); return; }
  if (isPlaying) return;
  
  currentBet = parseInt(document.getElementById("betAmount").value);
  if (!currentBet || currentBet < 1) { toast("مبلغ نامعتبر است.", true); return; }
  if (state.tokens < currentBet) { toast("موجودی کافی نیست!", true); return; }
  
  state.tokens -= currentBet;
  saveState();
  updateBalanceUI();
  
  isPlaying = true;
  revealedCount = 0;
  currentMult = 1.0;
  updateStats();
  updateNotification("منتظر انتخاب شما...", "neutral");
  
  minesPositions = [];
  while (minesPositions.length < minesCount) {
    var r = Math.floor(Math.random() * gridSize);
    if (minesPositions.indexOf(r) === -1) minesPositions.push(r);
  }
  
  var tiles = document.querySelectorAll(".tile");
  for (var i = 0; i < tiles.length; i++) {
    tiles[i].className = "tile";
    tiles[i].textContent = "";
  }
  
  document.getElementById("startBtn").style.display = "none";
  document.getElementById("cashoutBtn").style.display = "block";
  document.getElementById("cashoutBtn").disabled = true;
  document.getElementById("betAmount").disabled = true;
}

function revealTile(tile) {
  if (!isPlaying || tile.classList.contains("revealed")) return;
  
  var index = parseInt(tile.dataset.index);
  tile.classList.add("revealed");
  
  if (minesPositions.indexOf(index) !== -1) {
    // بمب!
    tile.classList.add("bomb");
    tile.textContent = "💥";
    updateNotification("❌ به بمب برخورد کردید! باختید.", "bomb");
    gameOver();
  } else {
    // الماس!
    tile.classList.add("gem");
    tile.textContent = "💎";
    revealedCount++;
    updateStats();
    
    updateNotification("✅ الماس پیدا کردید! + سود", "gem");
    
    document.getElementById("cashoutBtn").disabled = false;
    
    if (revealedCount === (gridSize - minesCount)) {
      cashOut();
    }
  }
}

function gameOver() {
  isPlaying = false;
  document.getElementById("cashoutBtn").style.display = "none";
  document.getElementById("startBtn").style.display = "block";
  document.getElementById("startBtn").disabled = true;
  document.getElementById("betAmount").disabled = false;
  
  var tiles = document.querySelectorAll(".tile");
  minesPositions.forEach(function(pos) {
    var t = tiles[pos];
    if (!t.classList.contains("bomb")) {
      t.classList.add("revealed", "dimmed");
      t.textContent = "💣";
    }
  });
  
  state.history.unshift({ type: "spin", mult: 0, amount: -currentBet, time: new Date().toLocaleString("fa-IR") });
  if(state.history.length > 50) state.history.pop();
  saveState();
  
  toast("انفجار! شما باختید.", true);
  
  setTimeout(function() {
    document.getElementById("startBtn").disabled = false;
  }, 2000);
}

function cashOut() {
  if (!isPlaying) return;
  isPlaying = false;
  
  var winAmount = Math.floor(currentBet * currentMult);
  state.tokens += winAmount;
  state.lastWin = currentMult;
  saveState();
  updateBalanceUI();
  
  var profit = winAmount - currentBet;
  state.history.unshift({ type: "spin", mult: currentMult, amount: profit, time: new Date().toLocaleString("fa-IR") });
  if(state.history.length > 50) state.history.pop();
  saveState();
  
  document.getElementById("cashoutBtn").style.display = "none";
  document.getElementById("startBtn").style.display = "block";
  document.getElementById("betAmount").disabled = false;
  
  var tiles = document.querySelectorAll(".tile");
  minesPositions.forEach(function(pos) {
    var t = tiles[pos];
    if (!t.classList.contains("revealed")) {
      t.classList.add("revealed", "dimmed");
      t.textContent = "💣";
    }
  });
  
  updateNotification("💰 شما با موفقیت " + winAmount + " توکن برداشت کردید!", "gem");
  toast("شما " + winAmount + " توکن بردید!", false);
}

// ==========================================
// ۴. اجرا
// ==========================================
initDB();
updateBalanceUI();
initGrid();
updateStats();

</script>
</body>
</html>
