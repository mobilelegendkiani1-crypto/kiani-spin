<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KIANI PLINKO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --panel: #111; --line: #332b00; --gold: #ffcc00; --red: #ff3355; --green: #00ff88; --white: #fff; --font-en: 'Orbitron'; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body { margin:0; background: radial-gradient(circle at 50% 0%, #1a0a0a 0%, #000 100%); color: #fff; font-family: 'Vazirmatn', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; user-select: none; }
.top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--line); border-radius: 0 0 16px 16px; }
.back-btn { color: var(--gold); text-decoration: none; font-weight: 700; font-size: 14px; }
.balance-box { background: #000; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--gold); font-family: var(--font-en); font-weight: 900; color: var(--gold); font-size: 16px; }
.container { width: 100%; max-width: 500px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
.canvas-wrapper { width: 100%; aspect-ratio: 1; border-radius: 20px; background: radial-gradient(circle at 50% 50%, #1a0000 0%, #050505 100%); border: 2px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.9); overflow: hidden; position: relative; }
canvas { width: 100%; height: 100%; display: block; }
.controls-row { width: 100%; margin-top: 15px; display: flex; gap: 10px; align-items: center; }
.bet-input { flex: 1; background: #000; border: 1px solid var(--line); border-radius: 10px; color: var(--gold); padding: 12px; font-family: var(--font-en); font-size: 16px; font-weight: 700; text-align: center; outline: none; }
.play-btn { background: linear-gradient(180deg, #ff3355, #990022); border: 2px solid #ff667f; border-radius: 10px; padding: 12px 20px; font-size: 16px; font-weight: 900; color: #fff; cursor: pointer; }
.play-btn:disabled { opacity: 0.5; filter: grayscale(1); }
.result-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(10,10,10,0.95); padding: 30px 40px; border-radius: 20px; border: 2px solid var(--line); text-align: center; display: none; z-index: 1000; }
.result-popup.show { display: block; animation: pop 0.3s forwards; }
@keyframes pop { to { transform: translate(-50%, -50%) scale(1); } }
.res-mult { font-family: var(--font-en); font-size: 50px; font-weight: 900; margin-bottom: 5px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="buysell.html" class="back-btn">🔙 منو</a>
  <div class="balance-box"><span id="balanceDisplay">0</span> <span style="font-size:10px;">T</span></div>
</div>

<div class="container">
  <div class="canvas-wrapper"><canvas id="gameCanvas" width="600" height="600"></canvas></div>
  <div class="controls-row">
    <input type="number" id="betAmount" class="bet-input" value="10" min="1">
    <button class="play-btn" id="playBtn" onclick="dropBall()">پرتاب</button>
  </div>
</div>

<div id="resultPopup" class="result-popup">
  <div class="res-mult" id="resMult">0x</div>
  <div id="resText" style="font-size:16px; margin-bottom:20px;"></div>
  <button onclick="document.getElementById('resultPopup').classList.remove('show')" style="background:var(--gold); border:none; padding:10px 20px; border-radius:10px; font-weight:bold; color:#000;">ادامه</button>
</div>

<script>
"use strict";
var STORAGE_KEY = "kiani_exchange_v5";
var SESSION_KEY = "kiani_exchange_session";
var TOKEN_PRICE = 1000;
var currentUser = null;
var userData = null;

function loadDB() {
  var s = localStorage.getItem(STORAGE_KEY);
  if (s) { var db = JSON.parse(s); currentUser = localStorage.getItem(SESSION_KEY); if (currentUser && db.users[currentUser]) userData = db.users[currentUser]; }
}
function saveDB() {
  if (currentUser && userData) {
    var db = JSON.parse(localStorage.getItem(STORAGE_KEY));
    db.users[currentUser] = userData;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }
}
function updateUI() { if (userData) document.getElementById("balanceDisplay").textContent = userData.tokens.toLocaleString("en-US"); }

// Game Setup
var canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
var W = 600, H = 600, rows = 12, pegR = 5, ballR = 10, gapX = 38, gapY = 40, startY = 70;
var wallX1 = 60, wallX2 = W - 60;
var multipliers = [10, 5, 2, 1.5, 1, 0, 0.2, 0, 1.5, 2, 5, 10];
var colors = ["#ff3355","#ffffff","#ffcc00","#ff3355","#ffcc00","#333","#333","#333","#ffcc00","#ff3355","#ffcc00","#ff3355"];
var pegs = [], balls = [], bins = [];

function initBoard() {
  for (var r = 0; r < rows; r++) {
    var pegsInRow = r + 3, rowStartX = (W - (pegsInRow - 1) * gapX) / 2;
    for (var c = 0; c < pegsInRow; c++) pegs.push({ x: rowStartX + c * gapX, y: startY + r * gapY, hit: 0 });
  }
  var binW = (wallX2 - wallX1) / multipliers.length;
  for (var i = 0; i < multipliers.length; i++) bins.push({ x: wallX1 + (i * binW), y: H - 40, w: binW, h: 40, mult: multipliers[i], color: colors[i] });
}

function updatePhysics() {
  for (var i = balls.length - 1; i >= 0; i--) {
    var b = balls[i]; b.vy += 0.3; b.x += b.vx; b.y += b.vy; b.vx *= 0.98;
    if (b.x < wallX1 + ballR) { b.x = wallX1 + ballR; b.vx *= -0.6; }
    if (b.x > wallX2 - ballR) { b.x = wallX2 - ballR; b.vx *= -0.6; }
    for (var j = 0; j < pegs.length; j++) {
      var p = pegs[j], dx = b.x - p.x, dy = b.y - p.y, dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < ballR + pegR) {
        var nx = dx / dist, ny = dy / dist, overlap = ballR + pegR - dist;
        b.x += nx * overlap; b.y += ny * overlap;
        var dot = b.vx * nx + b.vy * ny;
        b.vx = (b.vx - 2 * dot * nx) * 0.7; b.vy = (b.vy - 2 * dot * ny) * 0.7;
        p.hit = 1;
      }
    }
    if (b.y > H - 40 - ballR) {
      for (var k = 0; k < bins.length; k++) {
        if (b.x >= bins[k].x && b.x < bins[k].x + bins[k].w) { processResult(bins[k].mult, b.bet); break; }
      }
      balls.splice(i, 1);
    }
  }
  for (var j = 0; j < pegs.length; j++) if (pegs[j].hit > 0) pegs[j].hit -= 0.05;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 4; ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 15;
  ctx.beginPath(); ctx.moveTo(wallX1, 0); ctx.lineTo(wallX1, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(wallX2, 0); ctx.lineTo(wallX2, H); ctx.stroke();
  ctx.shadowBlur = 0;

  pegs.forEach(function(p) {
    ctx.beginPath(); ctx.arc(p.x, p.y, pegR, 0, Math.PI * 2);
    var grad = ctx.createRadialGradient(p.x-2, p.y-2, 1, p.x, p.y, pegR);
    if (p.hit > 0) { grad.addColorStop(0, "#fff"); grad.addColorStop(1, "#ff3355"); ctx.shadowColor = "#ff3355"; ctx.shadowBlur = 15; }
    else { grad.addColorStop(0, "#ffcc00"); grad.addColorStop(1, "#664d00"); ctx.shadowBlur = 0; }
    ctx.fillStyle = grad; ctx.fill();
  });
  ctx.shadowBlur = 0;

  bins.forEach(function(bin) {
    ctx.fillStyle = bin.color; ctx.globalAlpha = 0.15; ctx.fillRect(bin.x, bin.y, bin.w, bin.h);
    ctx.globalAlpha = 1; ctx.strokeStyle = bin.color; ctx.strokeRect(bin.x, bin.y, bin.w, bin.h);
    ctx.fillStyle = "#fff"; ctx.font = "bold 10px Orbitron"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(bin.mult + "x", bin.x + bin.w/2, bin.y + bin.h/2);
  });

  balls.forEach(function(b) {
    ctx.beginPath(); ctx.arc(b.x, b.y, ballR, 0, Math.PI * 2);
    var grad = ctx.createRadialGradient(b.x-3, b.y-3, 1, b.x, b.y, ballR);
    grad.addColorStop(0, "#fff"); grad.addColorStop(0.4, "#ff3355"); grad.addColorStop(1, "#990022");
    ctx.fillStyle = grad; ctx.shadowColor = "#ff3355"; ctx.shadowBlur = 15; ctx.fill();
  });
  ctx.shadowBlur = 0;
}

function dropBall() {
  if (!userData) return;
  var bet = Number(document.getElementById("betAmount").value);
  if (bet < 1 || bet > userData.tokens) return alert("موجودی یا مبلغ نامعتبر.");
  userData.tokens -= bet; saveDB(); updateUI();
  document.getElementById("playBtn").disabled = true;
  balls.push({ x: W/2 + (Math.random()-0.5)*20, y: 30, vx: (Math.random()-0.5)*3, vy: 0, bet: bet });
}

function processResult(mult, bet) {
  var win = Math.floor(bet * mult);
  userData.tokens += win; saveDB(); updateUI();
  document.getElementById("playBtn").disabled = false;
  document.getElementById("resMult").textContent = mult + "x";
  document.getElementById("resMult").style.color = mult >= 1 ? "var(--gold)" : "var(--red)";
  document.getElementById("resText").innerHTML = mult > 0 ? "برد: <span style='color:var(--gold)'>"+win+"</span> T" : "باخت";
  document.getElementById("resultPopup").classList.add("show");
}

function gameLoop() { updatePhysics(); draw(); requestAnimationFrame(gameLoop); }
loadDB(); if(userData) { updateUI(); initBoard(); gameLoop(); } else { document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:50px;'>ابتدا در منو ثبت‌نام کنید.</h2>"; }
</script>
</body>
</html>
