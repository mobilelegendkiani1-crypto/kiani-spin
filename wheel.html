<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KIANI WHEEL</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --panel: #111; --line: #332b00; --gold: #ffcc00; --red: #ff3355; --green: #00ff88; --white: #fff; --font-en: 'Orbitron', sans-serif; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body { margin:0; padding:0; background: radial-gradient(circle at 50% 0%, #1a1500 0%, #000 100%); color: #fff; font-family: 'Vazirmatn', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; user-select: none; }
.top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--line); border-radius: 0 0 16px 16px; backdrop-filter: blur(10px); }
.back-btn { color: var(--gold); text-decoration: none; font-weight: 700; font-size: 14px; }
.balance-box { background: #000; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--gold); font-family: var(--font-en); font-weight: 900; color: var(--gold); font-size: 16px; }
.container { width: 100%; max-width: 500px; padding: 15px; display: flex; flex-direction: column; align-items: center; }

/* Wheel */
.wheel-wrap { position: relative; width: 100%; aspect-ratio: 1; margin: 20px 0; }
.wheel { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--gold); box-shadow: 0 0 30px rgba(255,204,0,0.3); transition: transform 6s cubic-bezier(.17,.67,.16,1); position: relative; }
.wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 30px; height: 40px; fill: var(--gold); z-index: 10; filter: drop-shadow(0 0 10px var(--gold)); }

.controls { width: 100%; display: flex; flex-direction: column; gap: 15px; }
.bet-row { display: flex; gap: 10px; }
.bet-input { flex: 1; background: #000; border: 1px solid var(--line); border-radius: 10px; color: var(--gold); padding: 10px; text-align: center; font-family: var(--font-en); font-weight: bold; }
.spin-btn { width: 100%; background: linear-gradient(180deg, #ffcc00, #b38f00); color: #000; border: none; border-radius: 12px; padding: 18px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 20px rgba(255,204,0,0.3); transition: 0.2s; }
.spin-btn:active { transform: scale(0.98); }
.spin-btn:disabled { opacity: 0.5; filter: grayscale(1); }

.result-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(10,10,10,0.95); padding: 40px; border-radius: 20px; border: 2px solid var(--gold); text-align: center; display: none; z-index: 1000; }
.result-popup.show { display: block; animation: pop 0.3s forwards; }
@keyframes pop { to { transform: translate(-50%, -50%) scale(1); } }
.result-mult { font-family: var(--font-en); font-size: 60px; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="buysell.html" class="back-btn">🔙 منو</a>
  <div class="balance-box"><span id="balanceDisplay">0</span> <span style="font-size:10px;">T</span></div>
</div>

<div class="container">
  <div class="wheel-wrap">
    <svg class="wheel-pointer" viewBox="0 0 40 50"><path d="M20 50L0 15h40z"/></svg>
    <div id="wheel" class="wheel"></div>
  </div>
  <div class="controls">
    <div class="bet-row">
      <input type="number" id="betAmount" class="bet-input" value="10" min="1">
      <button class="spin-btn" id="spinBtn" onclick="spin()">چرخش</button>
    </div>
  </div>
</div>

<div id="resultPopup" class="result-popup">
  <div class="result-mult" id="resMult">0x</div>
  <div id="resText" style="color:#fff; font-size:18px; margin-bottom:20px;"></div>
  <button onclick="closeResult()" style="background:var(--gold); border:none; padding:10px 20px; border-radius:10px; font-weight:bold;">ادامه</button>
</div>

<script>
"use strict";
var STORAGE_KEY = "kiani_exchange_v5";
var SESSION_KEY = "kiani_exchange_session";
var currentUser = null;
var userData = null;
var isSpinning = false;

// ضرایب و شانس‌های گردونه
var SEGMENTS = [
  { mult: 0,   color: "#1a1a1a", label: "0x" },
  { mult: 0.5, color: "#333",    label: "0.5x" },
  { mult: 0.8, color: "#555",    label: "0.8x" },
  { mult: 0,   color: "#1a1a1a", label: "0x" },
  { mult: 1,   color: "#ffcc00", label: "1x" },
  { mult: 1.1, color: "#ffcc00", label: "1.1x" },
  { mult: 1.3, color: "#ff9900", label: "1.3x" },
  { mult: 0,   color: "#1a1a1a", label: "0x" },
  { mult: 1.5, color: "#ff9900", label: "1.5x" },
  { mult: 2,   color: "#ff5500", label: "2x" },
  { mult: 3,   color: "#ff5500", label: "3x" },
  { mult: 5,   color: "#ff0000", label: "5x" },
  { mult: 10,  color: "#ff0000", label: "10x" },
  { mult: 20,  color: "#ff00cc", label: "20x" },
  { mult: 50,  color: "#cc00ff", label: "50x" },
  { mult: 100, color: "#00e5ff", label: "100x" }
];
var WEIGHTS = [15, 12, 12, 15, 10, 8, 6, 15, 5, 4, 3, 2, 1, 0.5, 0.2, 0.1];
var currentRot = 0;

function loadDB() {
  var s = localStorage.getItem(STORAGE_KEY);
  if (s) { var db = JSON.parse(s); currentUser = localStorage.getItem(SESSION_KEY); if (currentUser && db.users[currentUser]) userData = db.users[currentUser]; }
}
function saveDB() {
  if (currentUser && userData) {
    var db = JSON.parse(localStorage.getItem(STORAGE_KEY));
    db.users[currentUser] = userData;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }
}
function updateUI() { if (userData) document.getElementById("balanceDisplay").textContent = userData.tokens.toLocaleString("en-US"); }

function buildWheel() {
  var wheel = document.getElementById("wheel");
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  var n = SEGMENTS.length, ang = 360/n, cx = 50, cy = 50, r = 50;

  for (var i = 0; i < n; i++) {
    var seg = SEGMENTS[i];
    var a1 = (i * ang - ang/2) * Math.PI/180 - Math.PI/2;
    var a2 = (i * ang + ang/2) * Math.PI/180 - Math.PI/2;
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    var x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    var path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", "M " + cx + " " + cy + " L " + x1 + " " + y1 + " A " + r + " " + r + " 0 0 1 " + x2 + " " + y2 + " Z");
    path.setAttribute("fill", seg.color);
    path.setAttribute("stroke", "#000");
    path.setAttribute("stroke-width", "0.5");
    svg.appendChild(path);
    
    var tx = cx + r * 0.7 * Math.cos((i * ang) * Math.PI/180 - Math.PI/2);
    var ty = cy + r * 0.7 * Math.sin((i * ang) * Math.PI/180 - Math.PI/2);
    var text = document.createElementNS(svgNS, "text");
    text.setAttribute("x", tx); text.setAttribute("y", ty);
    text.setAttribute("text-anchor", "middle"); text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("fill", "#000"); text.setAttribute("font-weight", "bold"); text.setAttribute("font-size", "4");
    text.setAttribute("transform", "rotate(" + (i * ang + 90) + " " + tx + " " + ty + ")");
    text.textContent = seg.label;
    svg.appendChild(text);
  }
  wheel.innerHTML = "";
  wheel.appendChild(svg);
}

function spin() {
  if (isSpinning || !userData) return;
  var bet = Number(document.getElementById("betAmount").value);
  if (bet < 1 || bet > userData.tokens) return alert("مبلغ یا موجودی نامعتبر است.");

  isSpinning = true;
  userData.tokens -= bet;
  updateUI(); saveDB();
  document.getElementById("spinBtn").disabled = true;

  var totalW = 0; for (var i=0; i<WEIGHTS.length; i++) totalW += WEIGHTS[i];
  var rnd = Math.random() * totalW, acc = 0, chosen = 0;
  for (var j=0; j<WEIGHTS.length; j++) { acc += WEIGHTS[j]; if(rnd < acc) { chosen = j; break; } }

  var seg = SEGMENTS[chosen];
  var ang = 360 / SEGMENTS.length;
  var target = 360 - (chosen * ang);
  var jitter = (Math.random() - 0.5) * (ang * 0.5);
  var spins = 5 + Math.floor(Math.random() * 3);
  var current = currentRot % 360;
  var finalRot = currentRot + spins * 360 + ((target - current + 360) % 360) + jitter;

  currentRot = finalRot;
  var wheel = document.getElementById("wheel");
  wheel.style.transform = "rotate(" + finalRot + "deg)";

  setTimeout(function() {
    var win = Math.floor(bet * seg.mult);
    userData.tokens += win;
    saveDB(); updateUI();
    isSpinning = false;
    document.getElementById("spinBtn").disabled = false;
    document.getElementById("resMult").textContent = seg.mult + "x";
    document.getElementById("resText").innerHTML = seg.mult > 0 ? 'شما <span style="color:var(--green)">'+win+'</span> توکن بردید!' : 'متأسفانه باختید!';
    document.getElementById("resultPopup").classList.add("show");
  }, 6000);
}

function closeResult() { document.getElementById("resultPopup").classList.remove("show"); }

loadDB(); buildWheel(); updateUI();
if (!userData) { document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:50px;'>ابتدا در منو ثبت‌نام کنید.</h2>"; }
</script>
</body>
</html>
